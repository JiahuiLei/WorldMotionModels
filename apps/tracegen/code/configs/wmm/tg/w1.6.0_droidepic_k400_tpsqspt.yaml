# WMM TraceGen (TG) DROID+EPIC K=400 — w1.6.0 (single-knob delta off w1.5.0).
# DELTA: replace dummy identity rotation with REAL local-frame rotations
# from data_wmm/tracegen_localframes/. Per-track re-anchored so t=0 (current
# frame) is identity → context naturally identity. Per-frame rot_valid is
# folded into trace_mask (α-mode); ~40% of frames lose position supv as a
# known cost. Loss weights kept at w1.5.0: w_q=0.1, w_R=0.0 (rot supervised
# via 6d-channel L1, geodesic disabled).
# Robust-to-missing: samples without a sidecar fall back to identity rot
# (rot_mask=False); init logs coverage. Eval/viz callbacks do NOT load
# localframe — they prompt with t=0=I (matches training distribution).
# compile_flag=True is MANDATORY in YAML; --fast_dev_run smoke uses
# --model.compile_flag=False CLI override only.

expname: w1.6.0_droidepic_k400_tpsqspt

max_steps: 1_000_000
train_batchsize: 4  # match per-env w1.5.0 k400 (D1=512). Each batch draws
                    # from the joint pool per sampling_weights.
accumulate_grad_batches: 1
workers: 10
log_every_n_steps: 5
val_every_n_iter: 10000
limit_val_batches: 50

dataset:
  name: wmm
  dataloader_drop_last: True
  persistent_workers_flag: True
  prefetch_factor: 4
  sampling_weights: [0.5, 0.5]   # equal mix droid/epic
  configs:
    - type: tracegen
      env_name: droid
      data_root: ./data_wmm/tracegen/data
      splits: ["train", "val", "test"]
      num_kps: 400
      trajectory_horizon: 32
      image_size: 384
      val_split: 0.01
      random_seed: 42
      safe_flag: True
      base_fps: 30.0
      t_rate: 1
      dummy_id_rot: False  # w1.6.0: real rot loaded via localframe_root
      localframe_root: ./data_wmm/tracegen_localframes  # w1.6.0
    - type: tracegen
      env_name: epic
      data_root: ./data_wmm/tracegen/data
      splits: ["train", "val", "test"]
      num_kps: 400
      trajectory_horizon: 32
      image_size: 384
      val_split: 0.01
      random_seed: 42
      safe_flag: True
      base_fps: 30.0
      t_rate: 1
      dummy_id_rot: False  # w1.6.0: real rot loaded via localframe_root
      localframe_root: ./data_wmm/tracegen_localframes  # w1.6.0

model:
  name: wmm
  latent_dim: 512
  feat_dim: 1024
  use_ema: True
  compile_flag: True
  rot_parameterization: "6d_wing"
  rot_wing_len: 0.2

  canonicalization:
    target_pos_std: 0.25
    canon_rotation: False
    per_axis_std: True

  diffusion:
    noise_type: ddpm
    prediction_type: sample
    network_output_space: null
    async_noise: True
    num_train_timesteps: 1000
    beta_schedule: squaredcos_cap_v2
    gen_timesteps: 50

  input_layer:
    num_types: 1024
    num_groups: 400
    language_fixed_length: 16
    point_encoder_latent: 256
    pcl_input_mode: "xyz_rgb"
    point_version: "v3"

  dino_encoder:
    model_name: dinov3_vits16
    num_views: 1
    trainable: False

  lmm:
    mode: super
    architecture: super
    D1: 512
    D2: 768
    cond_dim: 1024
    n_heads: 8
    fc_factor: 4
    layer_type_string: "tpsqspt"
    Rt: 4
    Rp: 4
    time_multiplier: 10.0
    ada_scale_bias_bound: 1.0
    gate_bound: 2.0
    fc_n_layers: 3
    fc_out_n_layers: 8
    ada_n_layers: 3
    n_traj_tokens: 400
    add_first_n_add_token_to_feat: 16
    rope_mode: "2d_time_trajid"
    traj_id_sampler: "permP"
    disable_trajpe: True

  optim:
    weight_by: uid
    text_masked_prob: 0.25
    ctx_always_known: True
    betas: [0.9, 0.999]
    weight_decay: 1.0e-3
    lr: 5.0e-5
    min_lr: 1.0e-6
    lr_decay_iters: 300000
    lr_warmup_iters: 500
    loss_beta: 0.02
    w_real: 1.0
    w_virtual: 0.05
    movement_reweight_min_ratio: 0.5
    movement_reweight_max_ratio: 4.0
    movement_scale: 2.0
    w_R: 0.0
    w_q: 0.1
    w_mae: 0.5

visualize:
  tg:
    env_name: droid   # train viz uses one env (droid). Per-batch, the
                      # viz callback picks samples from whichever env they
                      # came from in the joint dataloader.
    image_size: 384
    max_scaffold_pts: 2500

# TWO on-the-fly evals (one per env). Each becomes its own TgEvalCallback
# logging to `tg_eval/{env_name}/...` so distinct wandb keys are produced.
# `ckpt_monitor` below picks the droid metric for model selection.
# Note: configargparse YAMLConfigFileParser does NOT preserve YAML lists at
# the top level (flattens to last item), so we use TWO flat keys instead of
# a list. Wired in src/umm/sims/robot_sim_callbacks.py.
tg_eval:        # primary (model-selection metric)
  env_name: droid
  test_data_root: ./data_wmm/tracegen/data
  eval_every_n_steps: 10000
  batch_size: 4
  debug_every_n_steps: -1
  debug_subset_n_samples: 16
  num_workers: 4
  eval_effort: 0.03
  base_fps: 30.0
  t_rate: 1

  dummy_id_rot: True  # w1.6.0: eval/viz prompt with rot_mask all-True;
  # localframe NOT loaded — t=0=I prompt matches training
tg_eval_aux:    # auxiliary eval (additional env)
  env_name: epic
  test_data_root: ./data_wmm/tracegen/data
  eval_every_n_steps: 10000
  batch_size: 4
  debug_every_n_steps: -1
  debug_subset_n_samples: 16
  num_workers: 4
  eval_effort: 0.03
  base_fps: 30.0
  t_rate: 1

  dummy_id_rot: True  # w1.6.0: eval/viz prompt with rot_mask all-True;
  # localframe NOT loaded — t=0=I prompt matches training
precision: 16
matmul_precision: medium
init_seed: 42
num_sanity_val_steps: 0
viz_every_n_train_steps: 2000
viz_every_n_val_steps: 100
viz_try: True
gradient_clip_val: 4.0
gradient_clip_algorithm: norm
ckpt_monitor: "tg_eval/droid/trajectory_mae_x100"   # model selection on droid
ckpt_monitor_mode: "min"
ckpt_save_top_k: 1
ckpt_every_n_train_steps: 2000
ckpt_warmup_steps: 11000   # skip topk until just past first eval at step 10000
model_summary_detailed_level: 3
use_wandb: True
